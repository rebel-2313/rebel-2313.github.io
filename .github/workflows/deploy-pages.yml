# GitHub Pages 自动部署
# 每次 push 到 main 分支，自动把网站发布到 Pages。
# 仓库名必须是：你的用户名.github.io（个人主站形式）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动点「Run workflow」触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 写入 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间的部署只跑一个，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根目录：index.html 所在位置
          path: .

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
