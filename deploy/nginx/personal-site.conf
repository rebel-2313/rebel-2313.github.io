# =====================================================================
# 个人主页 Nginx 站点配置
# 放置位置（Ubuntu / Debian）：/etc/nginx/sites-available/personal-site
# 启用方式：
#   sudo ln -s /etc/nginx/sites-available/personal-site /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default     # 关掉默认站点，避免抢 80 端口
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    # 没有域名时写服务器公网 IP，或者暂时保留下划线（表示匹配所有请求）
    # 有了域名后改成： server_name yangyeer.com www.yangyeer.com;
    server_name _;

    # 站点根目录：把网站文件传到这个目录
    root /var/www/personal-site;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    # 日志（排错时可 tail 查看）
    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;

    # ---------------------------------------------------------------- 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------- 压缩（省流量、加快首屏）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------- 缓存策略
    # 图片 / 样式 / 脚本：缓存 7 天（改了内容记得用「部署脚本」重新上传）
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # HTML 与 Markdown：不缓存，保证改完刷新就能看到
    location ~* \.(?:html|md)$ {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------- 路由
    location / {
        try_files $uri $uri/ =404;
    }

    # 不对外暴露隐藏文件（.git、.env 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# =====================================================================
# 可选：绑定域名后启用 HTTPS（用 certbot 自动生成，不要手写）
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名 -d www.你的域名
# certbot 会自动在上面这个 server 块里插入 443 监听与证书路径，并加一条 80 → 443 跳转。
# =====================================================================
